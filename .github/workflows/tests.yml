name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions: {}

jobs:
  pytest:
    name: Home Assistant 2026.11 tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.14.2
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.2"

      - name: Install test dependencies
        run: python -m pip install homeassistant==2026.11.0 pysnmp pytest pytest-asyncio

      - name: Run tests
        # test_volume_identity_ha.py is expected to skip here; the HA 2026.10 job installs its compatible test framework.
        run: python -m pytest

  pytest-ha-2026-10:
    name: Home Assistant 2026.10.4 registry tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python 3.14.2
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.14.2"

      - name: Install HA registry test dependencies
        run: python -m pip install homeassistant==2026.10.4 pytest-homeassistant-custom-component==0.13.375 pysnmp pytest pytest-asyncio

      - name: Run real entity registry tests
        run: python -m pytest tests/test_volume_identity_ha.py
